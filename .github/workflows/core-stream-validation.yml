name: Core streaming validation
on:
  push:
    branches: [integrated/core-stream-1649-linux-20261029]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: cb46b2a8246ca66fb6999a132a0dc5101e8cf2dc
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: '0.10.2'
      - run: uv sync --all-extras
      - run: ./scripts/lint
      - run: uv build
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            test_python: '3.10'
          - python: '3.14'
            test_python: '>=3.14.0'
    env:
      UV_PYTHON: ${{ matrix.python }}
      TEST_API_BASE_URL: http://127.0.0.1:4010
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: cb46b2a8246ca66fb6999a132a0dc5101e8cf2dc
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: '0.10.2'
          python-version: ${{ matrix.python }}
      - run: ./scripts/test tests/test_models.py tests/test_client.py tests/test_response.py tests/test_streaming.py tests/lib/streaming/test_messages.py tests/lib/streaming/test_beta_messages.py -n 2
        env:
          UV_PYTHON: ${{ matrix.test_python }}
